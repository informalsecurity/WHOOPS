<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{INCIDENT_TITLE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #061A23 0%, #36495E 100%);
            color: #C8C9C7;
            overflow: hidden;
            height: 100vh;
        }

        #mainContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        svg#networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(6, 26, 35, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            z-index: 1000;
            border-bottom: 2px solid #008CD1;
        }

        .header h1 {
            font-size: 28px;
            color: #F6CF46;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .timeline-info {
            display: flex;
            gap: 30px;
            font-size: 14px;
            color: #C8C9C7;
        }

        .timeline-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timeline-info strong {
            color: #008CD1;
        }

        /* Control Panel */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 26, 35, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #008CD1;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            background: #008CD1;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 140, 209, 0.3);
        }

        button:hover {
            background: #36495E;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 140, 209, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.active-speed {
            background: #F6CF46;
            color: #061A23;
        }

        .progress-bar {
            width: 400px;
            height: 8px;
            background: rgba(200, 201, 199, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #008CD1, #F6CF46);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 140, 209, 0.8);
        }

        .time-display {
            text-align: center;
            margin-top: 10px;
            font-size: 22px;
            color: #C8C9C7;
            font-family: 'Courier New', monospace;
        }

        /* Event Details Modal */
        .event-modal {
            position: absolute;
            bottom: 20px;
            right: 20px;
            transform: scale(0);
            background: rgba(6, 26, 35, 0.98);
            backdrop-filter: blur(20px);
            border: 2px solid #008CD1;
            border-radius: 15px;
            padding: 20px;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
        }

        .event-modal.active {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #008CD1;
        }

        .modal-title {
            font-size: 20px;
            color: #F6CF46;
            text-shadow: 0 0 10px rgba(246, 207, 70, 0.3);
        }

        .close-modal {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .event-section {
            margin-bottom: 20px;
        }

        .event-section h3 {
            color: #008CD1;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .event-section p {
            color: #C8C9C7;
            line-height: 1.6;
        }

        .code-block {
            background: #061A23;
            border: 1px solid #008CD1;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #84A078;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .mitre-badge {
            display: inline-block;
            background: #F6CF46;
            color: #061A23;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Lateral movement label */
        .lateral-movement-label {
            position: absolute;
            background: rgba(246, 207, 70, 0.9);
            color: #061A23;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .lateral-movement-label.show {
            opacity: 1;
        }

        /* Email animation */
        .email-envelope {
            position: absolute;
            z-index: 200;
            opacity: 0;
            transition: all 1s ease;
        }

        .email-envelope.show {
            opacity: 1;
        }

        /* Legend */
        .legend {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(6, 26, 35, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #008CD1;
            z-index: 900;
        }

        .legend h3 {
            color: #F6CF46;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #C8C9C7;
        }

        .legend-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        /* Loading animation */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #008CD1;
            text-shadow: 0 0 20px rgba(0, 140, 209, 0.8);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(6, 26, 35, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #36495E;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #008CD1;
        }
    </style>
</head>
<body>
    <div id="mainContainer">
        <svg id="networkCanvas" xmlns="http://www.w3.org/2000/svg"></svg>
        
        <div class="header">
            <h1>{{INCIDENT_TITLE}}</h1>
            <div class="timeline-info">
                <span>Start: <strong id="startTime">{{START_TIME}}</strong></span>
                <span>End: <strong id="endTime">{{END_TIME}}</strong></span>
                <span>Duration: <strong>{{TOTAL_DURATION}} minutes</strong></span>
                <span>Events: <strong id="eventCount">0</strong></span>
            </div>
        </div>

        <div class="controls">
            <div class="control-buttons">
                <button id="playBtn" onclick="togglePlay()">Play</button>
                <button id="pauseBtn" onclick="togglePlay()" style="display:none">Pause</button>
                <button onclick="restart()">Restart</button>
                <button onclick="changeSpeed(0.5)">0.5x</button>
                <button onclick="changeSpeed(1)">1x</button>
                <button onclick="changeSpeed(2)">2x</button>
                <button onclick="changeSpeed(5)">5x</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="time-display" id="currentTimeDisplay">Ready to start</div>
        </div>

        <div class="legend">
            <h3>Legend</h3>
            <div class="legend-item">
                <div class="legend-icon" style="background: linear-gradient(135deg, #ff0000, #ff6600);"></div>
                <span>Threat Actor/Malicious</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon" style="background: #84A078; border: 2px solid #000;"></div>
                <span>Perimeter Device</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon" style="background: #008CD1; border: 2px solid #000;"></div>
                <span>Clean System</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon" style="background: #ff0000; border: 2px solid #ff0000;"></div>
                <span>Compromised System</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon" style="background: #F6CF46; border: 2px solid #F6CF46;"></div>
                <span>Beachhead Host</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon" style="background: #36495E; height: 2px; width: 20px; border-radius: 0;"></div>
                <span>Network Connection</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon" style="background: #ff0000; height: 2px; width: 20px; border-radius: 0; box-shadow: 0 0 5px rgba(255,0,0,0.8);"></div>
                <span>Attack Path</span>
            </div>
        </div>

        <div class="event-modal" id="eventModal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Event Details</h2>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>

        <div class="loading" id="loadingIndicator">Initializing Network Topology...</div>
    </div>

    <script>
        // Data from PowerShell
        let hosts = {{HOSTS_DATA}};
        let perimeterDevices = {{PERIMETER_DEVICES}};
        let timelineEvents = {{TIMELINE_EVENTS}};
        const attackScenario = '{{ATTACK_SCENARIO}}';
        const beachheadHost = '{{BEACHHEAD_HOST}}';
        
        // Ensure arrays are actually arrays
        if (!Array.isArray(hosts)) {
            hosts = hosts ? [hosts] : [];
        }
        if (!Array.isArray(perimeterDevices)) {
            perimeterDevices = perimeterDevices ? [perimeterDevices] : [];
        }
        if (!Array.isArray(timelineEvents)) {
            timelineEvents = timelineEvents ? [timelineEvents] : [];
        }
        
        // Clean up string values
        hosts = hosts.map(h => String(h).trim());
        perimeterDevices = perimeterDevices.map(p => String(p).trim());
        
        console.log('=== INITIALIZATION DEBUG ===');
        console.log('Attack Scenario:', attackScenario);
        console.log('Hosts (array):', hosts);
        console.log('Perimeter Devices (array):', perimeterDevices);
        console.log('Beachhead Host:', beachheadHost);
        console.log('Timeline Events Count:', timelineEvents.length);
        console.log('First Event:', timelineEvents[0]);
        
        // Animation state
        let isPlaying = false;
        let currentEventIndex = 0;
        let animationSpeed = 1;
        let nodes = {};
        let connections = {};
        let threatActorElement = null;
        let externalMaliciousElement = null;
        let compromisedHosts = new Set();
        let svg = null;
        
        function initializeNetwork() {
            console.log('=== STARTING NETWORK INITIALIZATION ===');
            console.log('Attack Scenario:', attackScenario);
            console.log('Hosts:', hosts);
            console.log('Perimeter Devices:', perimeterDevices);
            console.log('Beachhead Host:', beachheadHost);
            console.log('Timeline Events:', timelineEvents.length);
            
            // Validate we have data
            if (!hosts || hosts.length === 0) {
                if (attackScenario === 'internal_to_external' && beachheadHost) {
                    console.warn('No hosts array, but we have beachhead. Adding beachhead to hosts.');
                    hosts = [beachheadHost];
                } else {
                    console.error('No hosts data available and no beachhead specified!');
                    document.getElementById('loadingIndicator').textContent = 'Error: No hosts data';
                    document.getElementById('loadingIndicator').style.color = '#ff0000';
                    return;
                }
            }
            
            svg = document.getElementById('networkCanvas');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Show loading
            document.getElementById('loadingIndicator').style.display = 'block';
            
            // Calculate positions for nodes
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) * 0.25;
            
            // Create all connections first (as background)
            const connectionsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            connectionsGroup.setAttribute('id', 'connections-group');
            svg.appendChild(connectionsGroup);
            
            // Create nodes group
            const nodesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            nodesGroup.setAttribute('id', 'nodes-group');
            svg.appendChild(nodesGroup);
            
            console.log('Creating nodes for scenario:', attackScenario);
            
            if (attackScenario === 'external_to_perimeter') {
                // Scenario 1: External threat actor attacking perimeter
                console.log('Setting up external_to_perimeter scenario');
                createSVGNode('External', 100, centerY, 'threatActor', 'External Threat', true, false);
                
                // Create perimeter devices
                if (perimeterDevices && perimeterDevices.length > 0) {
                    console.log('Creating perimeter devices:', perimeterDevices);
                    const perimeterX = 300;
                    const perimeterStartY = centerY - (perimeterDevices.length - 1) * 60;
                    
                    perimeterDevices.forEach((device, index) => {
                        console.log(`Creating perimeter device ${index}: ${device}`);
                        const y = perimeterStartY + (index * 120);
                        createSVGNode(device, perimeterX, y, 'firewall', device, false, true);
                    });
                } else {
                    console.warn('No perimeter devices to create');
                }
                
                // Create internal hosts in a semi-circle
                if (hosts && hosts.length > 0) {
                    console.log('Creating internal hosts:', hosts);
                    const startAngle = -Math.PI / 2;
                    const endAngle = Math.PI / 2;
                    const angleStep = (endAngle - startAngle) / Math.max(hosts.length - 1, 1);
                    
                    hosts.forEach((host, index) => {
                        console.log(`Creating internal host ${index}: ${host}`);
                        const angle = startAngle + (index * angleStep);
                        const x = centerX + radius * Math.cos(angle);
                        const y = centerY + radius * Math.sin(angle);
                        createSVGNode(host, x, y, 'server', host, false, false);
                    });
                } else {
                    console.warn('No internal hosts to create');
                }
                
                // Create threat actor element
                createThreatActorElement();
                
            } else if (attackScenario === 'internal_to_external') {
                // Scenario 2: Internal beachhead reaching out to external malicious host
                console.log('Setting up internal_to_external scenario');
                console.log('Beachhead host:', beachheadHost);
                
                // Create malicious external host on LEFT side (consistent with Scenario 1)
                createSVGNode('External', 100, centerY, 'malicious', 'Malicious Host', false, false, true);
                
                // Create internal hosts in a semi-circle (right side)
                if (hosts && hosts.length > 0) {
                    console.log('Creating internal hosts:', hosts);
                    const startAngle = -Math.PI / 2;
                    const endAngle = Math.PI / 2;
                    const angleStep = (endAngle - startAngle) / Math.max(hosts.length - 1, 1);
                    
                    hosts.forEach((host, index) => {
                        console.log(`Creating internal host ${index}: ${host}`);
                        const angle = startAngle + (index * angleStep);
                        const x = centerX + radius * Math.cos(angle);
                        const y = centerY + radius * Math.sin(angle);
                        const isBeachhead = (host === beachheadHost);
                        console.log(`  Host ${host} is beachhead: ${isBeachhead}`);
                        createSVGNode(host, x, y, 'server', host, false, false, false, isBeachhead);
                    });
                } else {
                    console.error('No internal hosts for internal_to_external scenario!');
                }
                
                // Create malicious external element
                createExternalMaliciousElement();
            } else {
                console.error('Unknown attack scenario:', attackScenario);
            }
            
            console.log('Nodes created:', Object.keys(nodes));
            
            // Draw initial connections
            setTimeout(() => {
                console.log('Drawing connections...');
                drawConnections();
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('eventCount').textContent = timelineEvents.length;
                console.log('=== NETWORK INITIALIZATION COMPLETE ===');
            }, 500);
        }
        
        function createSVGNode(id, x, y, iconType, label, isThreat = false, isPerimeter = false, isMalicious = false, isBeachhead = false) {
            // Ensure id is a string
            id = String(id);
            label = String(label);
            
            console.log(`Creating node: ${id} at (${x}, ${y}) - Type: ${iconType}`);
            
            const nodesGroup = document.getElementById('nodes-group');
            
            // Create group for node
            const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const nodeId = `node-${id.replace(/[^a-zA-Z0-9]/g, '-')}`;
            nodeGroup.setAttribute('id', nodeId);
            nodeGroup.setAttribute('transform', `translate(${x}, ${y})`);
            nodeGroup.style.cursor = 'pointer';
            
            // Determine colors
            let fillColor, strokeColor, strokeWidth;
            if (isBeachhead) {
                fillColor = 'rgba(246, 207, 70, 0.2)';
                strokeColor = '#F6CF46';
                strokeWidth = '3';
            } else if (isPerimeter) {
                fillColor = 'rgba(132, 160, 120, 0.2)';
                strokeColor = '#84A078';
                strokeWidth = '2';
            } else if (isMalicious) {
                fillColor = 'rgba(255, 0, 0, 0.2)';
                strokeColor = '#ff0000';
                strokeWidth = '2';
            } else {
                fillColor = 'rgba(0, 140, 209, 0.2)';
                strokeColor = '#008CD1';
                strokeWidth = '2';
            }
            
            // Create circle background
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('r', '30');
            circle.setAttribute('fill', fillColor);
            circle.setAttribute('stroke', strokeColor);
            circle.setAttribute('stroke-width', strokeWidth);
            circle.classList.add('node-circle');
            
            // Add glow effect
            const filterId = `glow-${id.replace(/[^a-zA-Z0-9]/g, '-')}`;
            const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
            filter.setAttribute('id', filterId);
            filter.innerHTML = `
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            `;
            svg.appendChild(filter);
            circle.setAttribute('filter', `url(#${filterId})`);
            
            nodeGroup.appendChild(circle);
            
            // Add icon using simple shapes
            if (iconType === 'threatActor') {
                const threatIcon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                threatIcon.setAttribute('x', '0');
                threatIcon.setAttribute('y', '5');
                threatIcon.setAttribute('text-anchor', 'middle');
                threatIcon.setAttribute('font-size', '24');
                threatIcon.setAttribute('fill', '#fff');
                threatIcon.textContent = '☠';
                nodeGroup.appendChild(threatIcon);
            } else if (iconType === 'malicious') {
                const maliciousIcon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                maliciousIcon.setAttribute('x', '0');
                maliciousIcon.setAttribute('y', '10');
                maliciousIcon.setAttribute('text-anchor', 'middle');
                maliciousIcon.setAttribute('font-size', '28');
                maliciousIcon.setAttribute('fill', '#ff0000');
                maliciousIcon.textContent = '⚠';
                nodeGroup.appendChild(maliciousIcon);
            } else if (iconType === 'firewall') {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', '-15');
                rect.setAttribute('y', '-15');
                rect.setAttribute('width', '30');
                rect.setAttribute('height', '30');
                rect.setAttribute('fill', 'none');
                rect.setAttribute('stroke', '#84A078');
                rect.setAttribute('stroke-width', '2');
                nodeGroup.appendChild(rect);
                
                // Add shield symbol
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M 0,-10 L -10,0 L 0,10 L 10,0 Z');
                path.setAttribute('fill', '#84A078');
                nodeGroup.appendChild(path);
            } else {
                // Server icon - simple rectangles
                for (let i = 0; i < 3; i++) {
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', '-15');
                    rect.setAttribute('y', -10 + (i * 8));
                    rect.setAttribute('width', '30');
                    rect.setAttribute('height', '4');
                    rect.setAttribute('fill', isBeachhead ? '#F6CF46' : '#008CD1');
                    nodeGroup.appendChild(rect);
                }
            }
            
            // Add label
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '0');
            text.setAttribute('y', '45');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('font-size', '12');
            text.setAttribute('fill', '#C8C9C7');
            text.textContent = label;
            nodeGroup.appendChild(text);
            
            nodesGroup.appendChild(nodeGroup);
            
            nodes[id] = { 
                x: x, 
                y: y, 
                element: nodeGroup,
                circle: circle,
                isPerimeter: isPerimeter,
                isBeachhead: isBeachhead,
                isMalicious: isMalicious
            };
            
            console.log(`✓ Created node: ${id}`);
        }
        
        function createThreatActorElement() {
            if (nodes['External'] && attackScenario === 'external_to_perimeter') {
                const nodesGroup = document.getElementById('nodes-group');
                
                threatActorElement = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                threatActorElement.setAttribute('id', 'threat-actor');
                threatActorElement.setAttribute('transform', `translate(${nodes['External'].x}, ${nodes['External'].y})`);
                
                // Create pulsing red circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '25');
                circle.setAttribute('fill', 'none');
                circle.setAttribute('stroke', '#ff0000');
                circle.setAttribute('stroke-width', '3');
                
                // Add animation
                const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animate.setAttribute('attributeName', 'r');
                animate.setAttribute('values', '20;30;20');
                animate.setAttribute('dur', '2s');
                animate.setAttribute('repeatCount', 'indefinite');
                circle.appendChild(animate);
                
                const animateOpacity = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animateOpacity.setAttribute('attributeName', 'opacity');
                animateOpacity.setAttribute('values', '1;0.3;1');
                animateOpacity.setAttribute('dur', '2s');
                animateOpacity.setAttribute('repeatCount', 'indefinite');
                circle.appendChild(animateOpacity);
                
                threatActorElement.appendChild(circle);
                
                // Add inner circle
                const innerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                innerCircle.setAttribute('r', '15');
                innerCircle.setAttribute('fill', 'rgba(255, 0, 0, 0.3)');
                innerCircle.setAttribute('stroke', '#ff6600');
                innerCircle.setAttribute('stroke-width', '2');
                threatActorElement.appendChild(innerCircle);
                
                // Add warning symbol
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', '0');
                text.setAttribute('y', '5');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '20');
                text.setAttribute('fill', '#fff');
                text.setAttribute('font-weight', 'bold');
                text.textContent = '!';
                threatActorElement.appendChild(text);
                
                nodesGroup.appendChild(threatActorElement);
            }
        }
        
        function createExternalMaliciousElement() {
            if (nodes['External'] && attackScenario === 'internal_to_external') {
                const nodesGroup = document.getElementById('nodes-group');
                
                externalMaliciousElement = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                externalMaliciousElement.setAttribute('id', 'external-malicious');
                externalMaliciousElement.setAttribute('transform', `translate(${nodes['External'].x}, ${nodes['External'].y})`);
                
                // Create pulsing red circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '25');
                circle.setAttribute('fill', 'none');
                circle.setAttribute('stroke', '#ff0000');
                circle.setAttribute('stroke-width', '3');
                
                // Add animation
                const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animate.setAttribute('attributeName', 'r');
                animate.setAttribute('values', '20;30;20');
                animate.setAttribute('dur', '2s');
                animate.setAttribute('repeatCount', 'indefinite');
                circle.appendChild(animate);
                
                const animateOpacity = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animateOpacity.setAttribute('attributeName', 'opacity');
                animateOpacity.setAttribute('values', '1;0.3;1');
                animateOpacity.setAttribute('dur', '2s');
                animateOpacity.setAttribute('repeatCount', 'indefinite');
                circle.appendChild(animateOpacity);
                
                externalMaliciousElement.appendChild(circle);
                
                nodesGroup.appendChild(externalMaliciousElement);
            }
        }
        
        function drawConnections() {
            const connectionsGroup = document.getElementById('connections-group');
            
            // Clear existing connections
            while (connectionsGroup.firstChild) {
                connectionsGroup.removeChild(connectionsGroup.firstChild);
            }
            
            // Create unique connections based on events
            const drawnPairs = new Set();
            
            timelineEvents.forEach(event => {
                const pairKey = `${event.sourceHost}-${event.destinationHost}`;
                const reversePairKey = `${event.destinationHost}-${event.sourceHost}`;
                
                if (!drawnPairs.has(pairKey) && !drawnPairs.has(reversePairKey)) {
                    if (nodes[event.sourceHost] && nodes[event.destinationHost]) {
                        drawnPairs.add(pairKey);
                        createSVGConnection(event.sourceHost, event.destinationHost);
                    }
                }
            });
        }
        
        function createSVGConnection(fromId, toId, isActive = false) {
            const from = nodes[fromId];
            const to = nodes[toId];
            
            if (!from || !to) return;
            
            const connectionsGroup = document.getElementById('connections-group');
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', from.x);
            line.setAttribute('y1', from.y);
            line.setAttribute('x2', to.x);
            line.setAttribute('y2', to.y);
            line.setAttribute('stroke', isActive ? '#ff0000' : '#36495E');
            line.setAttribute('stroke-width', isActive ? '3' : '2');
            line.setAttribute('id', `conn-${fromId}-${toId}`.replace(/[^a-zA-Z0-9\-]/g, '-'));
            
            if (isActive) {
                line.setAttribute('stroke-dasharray', '10,5');
                
                const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animate.setAttribute('attributeName', 'stroke-dashoffset');
                animate.setAttribute('values', '0;15');
                animate.setAttribute('dur', '1s');
                animate.setAttribute('repeatCount', 'indefinite');
                line.appendChild(animate);
            }
            
            connectionsGroup.appendChild(line);
            connections[`${fromId}-${toId}`] = line;
            
            return line;
        }
        
        function animateEvent(event) {
            console.log('Animating event:', event);
            
            if (attackScenario === 'external_to_perimeter') {
                animateExternalToPerimeter(event);
            } else if (attackScenario === 'internal_to_external') {
                animateInternalToExternal(event);
            }
            
            // Show event details modal
            showEventModal(event);
            
            // Update progress
            updateProgress();
        }
        
        function animateExternalToPerimeter(event) {
            console.log('Animating external_to_perimeter event:', event);
            console.log('  Source:', event.sourceHost, '→ Destination:', event.destinationHost);
            
            // First, move threat actor to the SOURCE position (if it's not External)
            // This ensures the actor is at the correct starting point for the attack
            if (event.sourceHost !== 'External' && nodes[event.sourceHost] && threatActorElement) {
                const sourceNode = nodes[event.sourceHost];
                console.log('  Moving threat actor to source:', event.sourceHost);
                
                // Move to source position instantly (should already be there from previous event)
                threatActorElement.style.transition = 'none';
                threatActorElement.setAttribute('transform', `translate(${sourceNode.x}, ${sourceNode.y})`);
                
                // Small delay to ensure position is set
                setTimeout(() => {
                    threatActorElement.style.transition = 'transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                }, 50);
            }
            
            // Mark source as compromised if it's not External
            if (event.sourceHost !== 'External' && nodes[event.sourceHost]) {
                const sourceNode = nodes[event.sourceHost];
                if (!compromisedHosts.has(event.sourceHost)) {
                    sourceNode.circle.setAttribute('fill', 'rgba(255, 0, 0, 0.2)');
                    sourceNode.circle.setAttribute('stroke', '#ff0000');
                    sourceNode.circle.setAttribute('stroke-width', '3');
                    compromisedHosts.add(event.sourceHost);
                }
            }
            
            // Highlight the connection
            highlightConnection(event);
            
            // Animate threat actor movement to destination
            if (nodes[event.destinationHost] && threatActorElement) {
                const targetNode = nodes[event.destinationHost];
                
                console.log('  Moving threat actor to destination:', event.destinationHost);
                
                // Smooth transition to new position (after the small delay above)
                setTimeout(() => {
                    threatActorElement.setAttribute('transform', `translate(${targetNode.x}, ${targetNode.y})`);
                }, 100);
                
                // Show lateral movement method if exists
                if (event.lateralMovement) {
                    showLateralMovementLabel(event);
                }
                
                // Mark destination as compromised after delay
                setTimeout(() => {
                    targetNode.circle.setAttribute('fill', 'rgba(255, 0, 0, 0.7)');
                    targetNode.circle.setAttribute('stroke', '#ff0000');
                    targetNode.circle.setAttribute('stroke-width', '4');
                    compromisedHosts.add(event.destinationHost);
                    console.log('  ✓ Compromised:', event.destinationHost);
                }, 600);
            }
        }
        
        function animateInternalToExternal(event) {
            console.log('Animating internal_to_external event:', event);
            console.log('  Source:', event.sourceHost, '→ Destination:', event.destinationHost);
            
            // For first event (beachhead reaching out to download malware)
            if (event.isInitialAccess && event.destinationHost === 'External') {
                console.log('  Initial beachhead infection');
                // Highlight connection from beachhead to external
                highlightConnection(event);
                
                // Show download animation
                setTimeout(() => {
                    if (nodes[event.sourceHost]) {
                        const beachheadNode = nodes[event.sourceHost];
                        beachheadNode.circle.setAttribute('fill', 'rgba(255, 0, 0, 0.7)');
                        beachheadNode.circle.setAttribute('stroke', '#ff0000');
                        beachheadNode.circle.setAttribute('stroke-width', '4');
                        compromisedHosts.add(event.sourceHost);
                        console.log('  ✓ Beachhead compromised:', event.sourceHost);
                    }
                }, 1000);
            } else {
                // Lateral movement from one host to another
                console.log('  Lateral movement within network');
                
                // Mark source as compromised if not already
                if (event.sourceHost !== 'External' && nodes[event.sourceHost]) {
                    const sourceNode = nodes[event.sourceHost];
                    if (!compromisedHosts.has(event.sourceHost)) {
                        sourceNode.circle.setAttribute('fill', 'rgba(255, 0, 0, 0.2)');
                        sourceNode.circle.setAttribute('stroke', '#ff0000');
                        sourceNode.circle.setAttribute('stroke-width', '3');
                        compromisedHosts.add(event.sourceHost);
                    }
                }
                
                highlightConnection(event);
                
                if (event.lateralMovement) {
                    showLateralMovementLabel(event);
                }
                
                // Mark destination as compromised (or exfiltration point)
                if (event.destinationHost === 'External') {
                    console.log('  Exfiltration to external');
                } else if (nodes[event.destinationHost]) {
                    setTimeout(() => {
                        const targetNode = nodes[event.destinationHost];
                        targetNode.circle.setAttribute('fill', 'rgba(255, 0, 0, 0.7)');
                        targetNode.circle.setAttribute('stroke', '#ff0000');
                        targetNode.circle.setAttribute('stroke-width', '4');
                        compromisedHosts.add(event.destinationHost);
                        console.log('  ✓ Compromised:', event.destinationHost);
                    }, 500);
                }
            }
        }
        
        function highlightConnection(event) {
            const connKey = `${event.sourceHost}-${event.destinationHost}`;
            const reverseKey = `${event.destinationHost}-${event.sourceHost}`;
            
            let connection = connections[connKey] || connections[reverseKey];
            if (connection) {
                connection.setAttribute('stroke', '#ff0000');
                connection.setAttribute('stroke-width', '3');
                connection.setAttribute('stroke-dasharray', '10,5');
                
                // Remove existing animations
                while (connection.firstChild) {
                    connection.removeChild(connection.firstChild);
                }
                
                // Add new animation
                const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animate.setAttribute('attributeName', 'stroke-dashoffset');
                animate.setAttribute('values', '0;15');
                animate.setAttribute('dur', '1s');
                animate.setAttribute('repeatCount', 'indefinite');
                connection.appendChild(animate);
            } else {
                // Create new active connection if it doesn't exist
                createSVGConnection(event.sourceHost, event.destinationHost, true);
            }
        }
        
        function showLateralMovementLabel(event) {
            if (!event.lateralMovement) return;
            
            const from = nodes[event.sourceHost];
            const to = nodes[event.destinationHost];
            
            if (!from || !to) return;
            
            const label = document.createElement('div');
            label.className = 'lateral-movement-label';
            label.textContent = event.lateralMovement;
            
            const midX = (from.x + to.x) / 2;
            const midY = (from.y + to.y) / 2;
            
            label.style.left = `${midX - 50}px`;
            label.style.top = `${midY + 10}px`;
            
            document.getElementById('mainContainer').appendChild(label);
            
            setTimeout(() => {
                label.classList.add('show');
                setTimeout(() => {
                    label.remove();
                }, 3000);
            }, 100);
        }
        
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        function showEventModal(event) {
            const modal = document.getElementById('eventModal');
            const content = document.getElementById('modalContent');
            
            // Helper function to process text with line breaks
            function processText(text) {
                if (!text) return '';
                let processed = String(text);
                // Convert literal sequences like "\n" to actual newlines
                processed = processed.replace(/\\r\\n/g, '\n')
                                   .replace(/\\n/g, '\n')
                                   .replace(/\\r/g, '\n');
                // Escape HTML to be safe
                processed = escapeHtml(processed);
                // Convert real newlines to <br> for HTML rendering
                processed = processed.replace(/\r\n|\r|\n/g, '<br>');
                return processed;
            }
            
            let html = '';
            
            // Action section
            html += '<div class="event-section">';
            html += '<h3>Action</h3>';
            html += `<p>${escapeHtml(event.action)}</p>`;
            html += '</div>';
            
            // Path section
            html += '<div class="event-section">';
            html += '<h3>Attack Path</h3>';
            html += `<p>${escapeHtml(event.sourceHost)} → ${escapeHtml(event.destinationHost)}</p>`;
            if (event.lateralMovement) {
                html += `<p><strong>Method:</strong> ${escapeHtml(event.lateralMovement)}</p>`;
            }
            html += '</div>';
            
            // Tools section
            if (event.tools) {
                html += '<div class="event-section">';
                html += '<h3>Tools Used</h3>';
                html += `<p>${processText(event.tools)}</p>`;
                html += '</div>';
            }
            
            // Files section
            if (event.files) {
                html += '<div class="event-section">';
                html += '<h3>Files Involved</h3>';
                html += `<p>${processText(event.files)}</p>`;
                html += '</div>';
            }
            
            // Technical details
            if (event.details) {
                html += '<div class="event-section">';
                html += '<h3>Technical Details</h3>';
                html += `<div class="code-block">${processText(event.details)}</div>`;
                html += '</div>';
            }
            
            // MITRE ATT&CK
            if (event.mitreId || event.mitreTechnique) {
                html += '<div class="event-section">';
                html += '<h3>MITRE ATT&CK Mapping</h3>';
                
                // Parse multiple techniques (line-delimited)
                const mitreIds = event.mitreId ? String(event.mitreId).split('\n').map(s => s.trim()).filter(s => s) : [];
                const mitreTechniques = event.mitreTechnique ? String(event.mitreTechnique).split('\n').map(s => s.trim()).filter(s => s) : [];
                
                // Display each technique with its ID
                const maxLength = Math.max(mitreIds.length, mitreTechniques.length);
                
                if (maxLength > 0) {
                    for (let i = 0; i < maxLength; i++) {
                        const techName = mitreTechniques[i] || '';
                        const techId = mitreIds[i] || '';
                        
                        if (techName || techId) {
                            html += '<div style="margin-bottom: 10px;">';
                            if (techName) {
                                html += `<p style="margin-bottom: 5px;">${escapeHtml(techName)}</p>`;
                            }
                            if (techId) {
                                html += `<div class="mitre-badge">${escapeHtml(techId)}</div>`;
                            }
                            html += '</div>';
                        }
                    }
                } else if (event.mitreTechnique) {
                    html += `<p>${escapeHtml(event.mitreTechnique)}</p>`;
                }
                
                html += '</div>';
            }
            
            content.innerHTML = html;
            modal.classList.add('active');
            
            // Calculate event timing
            const eventTime = new Date(event.timestamp);
            const firstTime = new Date(timelineEvents[0].timestamp);
            const diffMinutes = Math.floor((eventTime - firstTime) / 60000);
            const totalHours = Math.floor(diffMinutes / 60);
            const day = Math.floor(totalHours / 24);
            const hour = totalHours % 24;
            
            // Update display with two lines
            document.getElementById('currentTimeDisplay').innerHTML = 
                `Event ${currentEventIndex + 1}/${timelineEvents.length} - ${event.timestamp}<br>` +
                `Day ${day}, Hour ${hour}`;
        }
        
        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }
        
        function updateProgress() {
            const progress = ((currentEventIndex + 1) / timelineEvents.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }
        
        function togglePlay() {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                document.getElementById('playBtn').style.display = 'none';
                document.getElementById('pauseBtn').style.display = 'inline-block';
                playTimeline();
            } else {
                document.getElementById('playBtn').style.display = 'inline-block';
                document.getElementById('pauseBtn').style.display = 'none';
            }
        }
        
        function playTimeline() {
            if (!isPlaying || currentEventIndex >= timelineEvents.length) {
                if (currentEventIndex >= timelineEvents.length) {
                    isPlaying = false;
                    document.getElementById('playBtn').style.display = 'inline-block';
                    document.getElementById('pauseBtn').style.display = 'none';
                    document.getElementById('currentTimeDisplay').textContent = 'Timeline Complete';
                }
                return;
            }
            
            const event = timelineEvents[currentEventIndex];
            animateEvent(event);
            
            currentEventIndex++;
            
            // Calculate delay for next event
            let delay = 3000 / animationSpeed;
            
            if (event.details || event.tools || event.files) {
                delay += 2000 / animationSpeed;
            }
            
            setTimeout(() => {
                if (isPlaying) {
                    closeModal();
                    setTimeout(() => {
                        playTimeline();
                    }, 500);
                }
            }, delay);
        }
        
        function restart() {
            isPlaying = false;
            currentEventIndex = 0;
            compromisedHosts.clear();
            
            document.getElementById('playBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('currentTimeDisplay').textContent = 'Ready to start';
            
            // Reset node states
            Object.values(nodes).forEach(node => {
                if (node.circle) {
                    if (node.isPerimeter) {
                        node.circle.setAttribute('fill', 'rgba(132, 160, 120, 0.2)');
                        node.circle.setAttribute('stroke', '#84A078');
                        node.circle.setAttribute('stroke-width', '2');
                    } else if (node.isBeachhead) {
                        node.circle.setAttribute('fill', 'rgba(246, 207, 70, 0.2)');
                        node.circle.setAttribute('stroke', '#F6CF46');
                        node.circle.setAttribute('stroke-width', '3');
                    } else if (node.isMalicious) {
                        node.circle.setAttribute('fill', 'rgba(255, 0, 0, 0.2)');
                        node.circle.setAttribute('stroke', '#ff0000');
                        node.circle.setAttribute('stroke-width', '2');
                    } else {
                        node.circle.setAttribute('fill', 'rgba(0, 140, 209, 0.2)');
                        node.circle.setAttribute('stroke', '#008CD1');
                        node.circle.setAttribute('stroke-width', '2');
                    }
                }
            });
            
            // Reset threat actor position
            if (threatActorElement && nodes['External'] && attackScenario === 'external_to_perimeter') {
                threatActorElement.style.transition = 'none';
                threatActorElement.setAttribute('transform', `translate(${nodes['External'].x}, ${nodes['External'].y})`);
                setTimeout(() => {
                    threatActorElement.style.transition = 'transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                }, 100);
            }
            
            // Reset connections
            Object.values(connections).forEach(line => {
                line.setAttribute('stroke', '#36495E');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-dasharray', 'none');
                while (line.firstChild) {
                    line.removeChild(line.firstChild);
                }
            });
            
            closeModal();
        }
        
        function changeSpeed(speed) {
            animationSpeed = speed;
            
            document.querySelectorAll('.control-buttons button').forEach(btn => {
                if (btn.textContent.includes('x')) {
                    if (btn.textContent === `${speed}x`) {
                        btn.classList.add('active-speed');
                    } else {
                        btn.classList.remove('active-speed');
                    }
                }
            });
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'r':
                    restart();
                    break;
                case 'Escape':
                    closeModal();
                    break;
            }
        });
        
        // Initialize on load
        window.addEventListener('load', () => {
            console.log('=== PAGE LOADED ===');
            console.log('Raw hosts data:', hosts);
            console.log('Raw perimeter data:', perimeterDevices);
            console.log('Raw timeline data:', timelineEvents);
            console.log('Attack scenario:', attackScenario);
            console.log('Beachhead host:', beachheadHost);
            
            // Validate data types
            if (!Array.isArray(hosts)) {
                console.error('Hosts is not an array!', typeof hosts, hosts);
            }
            if (!Array.isArray(perimeterDevices)) {
                console.error('Perimeter devices is not an array!', typeof perimeterDevices, perimeterDevices);
            }
            if (!Array.isArray(timelineEvents)) {
                console.error('Timeline events is not an array!', typeof timelineEvents, timelineEvents);
                document.getElementById('loadingIndicator').textContent = 'Error: Invalid timeline data';
                document.getElementById('loadingIndicator').style.color = '#ff0000';
                return;
            }
            
            // Validate we have events
            if (!timelineEvents || timelineEvents.length === 0) {
                console.error('No timeline events found!');
                document.getElementById('loadingIndicator').textContent = 'Error: No timeline events found';
                document.getElementById('loadingIndicator').style.color = '#ff0000';
                return;
            }
            
            // For scenario validation
            if (attackScenario === 'external_to_perimeter') {
                if (perimeterDevices.length === 0) {
                    console.warn('External to perimeter scenario but no perimeter devices!');
                }
                if (hosts.length === 0) {
                    console.warn('External to perimeter scenario but no internal hosts!');
                }
            } else if (attackScenario === 'internal_to_external') {
                if (!beachheadHost || beachheadHost === '') {
                    console.error('Internal to external scenario but no beachhead host specified!');
                }
                if (hosts.length === 0) {
                    console.error('Internal to external scenario but no internal hosts!');
                    document.getElementById('loadingIndicator').textContent = 'Error: No internal hosts for beachhead scenario';
                    document.getElementById('loadingIndicator').style.color = '#ff0000';
                    return;
                }
            }
            
            // Initialize the network visualization
            try {
                initializeNetwork();
                
                // Show ready message
                setTimeout(() => {
                    document.getElementById('currentTimeDisplay').textContent = 
                        'Press Play or Spacebar to begin';
                }, 1000);
            } catch (error) {
                console.error('Error initializing network:', error);
                document.getElementById('loadingIndicator').textContent = 'Error: ' + error.message;
                document.getElementById('loadingIndicator').style.color = '#ff0000';
            }
        });
    </script>
</body>
</html>
